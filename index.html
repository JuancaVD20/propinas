<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Propinas del café</title>
<style>
  :root {
    --bg: #f4f1ec;
    --card: #ffffff;
    --ink: #1f2933;
    --muted: #6b7280;
    --line: #e5e1da;
    --brand: #0f766e;
    --brand-soft: #e6f4f2;
    --am: #b45309;
    --am-soft: #fdf3e4;
    --pm: #4338ca;
    --pm-soft: #eef0fd;
    --danger: #b91c1c;
    --warn-bg: #fff4e5;
    --warn: #92400e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* Encabezado y pestañas */
  .top {
    position: sticky; top: 0; z-index: 10;
    background: var(--brand); color: #fff;
    padding: 10px 16px 0;
  }
  .top h1 { margin: 0 0 8px; font-size: 20px; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; }
  .tabs button {
    flex: 1; border: 0; background: transparent; color: #cdeae6;
    padding: 8px 4px 10px; font-size: 15px; border-bottom: 3px solid transparent;
    white-space: nowrap;
  }
  .tabs button.on { color: #fff; border-bottom-color: #fff; font-weight: 600; }

  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; }
  h2 { font-size: 24px; margin: 4px 0 6px; line-height: 1.2; }
  .hint { color: var(--muted); margin: 0 0 16px; }
  .steps { display: flex; gap: 6px; margin-bottom: 14px; }
  .steps span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
  .steps span.on { background: var(--brand); }
  .steplabel { font-size: 14px; color: var(--muted); margin-bottom: 4px; }

  .card {
    background: var(--card); border-radius: 14px; padding: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06); margin-bottom: 12px;
  }
  label.field { display: block; margin-bottom: 18px; }
  label.field .lbl { display: block; font-weight: 600; margin-bottom: 6px; }
  label.field .sub { display: block; color: var(--muted); font-size: 14px; font-weight: 400; }
  .big-input {
    width: 100%; font-size: 26px; padding: 14px 14px; border-radius: 12px;
    border: 2px solid var(--line); background: #fff;
  }
  .big-input:focus { outline: none; border-color: var(--brand); }
  .money { position: relative; }
  .money::before {
    content: "$"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 26px; color: var(--muted);
  }
  .money .big-input { padding-left: 34px; }

  /* Botones */
  .btn {
    display: block; width: 100%; border: 0; border-radius: 12px;
    padding: 15px 16px; font-size: 18px; font-weight: 600;
    background: var(--brand); color: #fff;
  }
  .btn.sec { background: #fff; color: var(--brand); border: 2px solid var(--brand); }
  .btn.ghost { background: transparent; color: var(--brand); }
  .btn.danger { background: #fff; color: var(--danger); border: 2px solid #f3c4c4; }
  .btn:disabled { opacity: .45; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .stack > * + * { margin-top: 10px; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: rgba(244,241,236,.97); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .bar-inner { max-width: 560px; margin: 0 auto; }
  .bar .totals { font-size: 14px; color: var(--muted); text-align: center; margin-bottom: 8px; }
  .bar .totals b { color: var(--ink); }

  .warn {
    background: var(--warn-bg); color: var(--warn); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 12px; font-size: 15px;
  }
  .note { background: var(--brand-soft); color: #134e4a; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 15px; }

  /* Tarjetas de personas */
  .person { padding: 12px 14px; }
  .person.active { box-shadow: inset 4px 0 0 var(--brand), 0 1px 2px rgba(0,0,0,.06); }
  .pname { font-weight: 700; font-size: 18px; margin-bottom: 8px; }
  .turns { display: flex; gap: 10px; }
  .turn { flex: 1; border-radius: 10px; padding: 6px; display: flex; align-items: center; gap: 4px; }
  .turn.am { background: var(--am-soft); }
  .turn.pm { background: var(--pm-soft); }
  .tlabel { font-size: 13px; font-weight: 700; width: 26px; text-align: center; }
  .am .tlabel { color: var(--am); }
  .pm .tlabel { color: var(--pm); }
  .turn button {
    width: 40px; height: 40px; flex: none; border-radius: 50%; border: 0;
    background: #fff; font-size: 22px; line-height: 1; font-weight: 700;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
  }
  .turn input {
    width: 100%; min-width: 0; text-align: center; border: 0; background: transparent;
    font-size: 20px; font-weight: 700; padding: 6px 0;
  }
  .turn input:focus { outline: 2px solid var(--brand); border-radius: 6px; background: #fff; }
  .add-row { display: flex; gap: 8px; }
  .add-row input {
    flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 2px solid var(--line); font-size: 17px;
  }
  .add-row button { flex: none; width: auto; padding: 12px 16px; }

  /* Consolidado */
  .sheet { background: #fff; border-radius: 14px; padding: 16px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 14px; }
  .sheet-title { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); font-weight: 700; }
  .sheet-date { font-size: 20px; font-weight: 700; margin: 2px 0 12px; }
  .pools { display: flex; gap: 8px; margin-bottom: 14px; }
  .pool { flex: 1; border-radius: 10px; padding: 8px 10px; }
  .pool.am { background: var(--am-soft); }
  .pool.pm { background: var(--pm-soft); }
  .pool span { display: block; font-size: 13px; font-weight: 700; }
  .pool.am span { color: var(--am); }
  .pool.pm span { color: var(--pm); }
  .pool b { display: block; font-size: 20px; }
  .pool small { color: var(--muted); font-size: 12px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
  .t th { font-size: 12px; text-transform: uppercase; color: var(--muted); text-align: right; padding: 4px 4px 6px; border-bottom: 2px solid var(--line); }
  .t th:first-child, .t td:first-child { text-align: left; }
  .t td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; }
  .t td small { display: block; color: var(--muted); font-size: 12px; }
  .t td.name { font-weight: 600; word-break: break-word; }
  .t td.tot { font-weight: 700; }
  .t .c-am { color: var(--am); }
  .t .c-pm { color: var(--pm); }
  .t tfoot td { border-bottom: 0; border-top: 2px solid var(--ink); font-weight: 700; }
  .t .zero { color: #c4c0b8; }
  .grand { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; font-size: 18px; }
  .grand b { font-size: 24px; }
  .round-note { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* Listas */
  .list-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; text-align: left; border: 0; background: #fff; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .list-item .l1 { font-weight: 600; }
  .list-item .l2 { font-size: 14px; color: var(--muted); }
  .list-item .amt { font-weight: 700; white-space: nowrap; }
  .x {
    border: 0; background: #fbeaea; color: var(--danger); border-radius: 10px;
    padding: 8px 12px; font-size: 15px; font-weight: 600; flex: none;
  }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }

  .seg { display: flex; background: #e8e3db; border-radius: 12px; padding: 4px; margin-bottom: 12px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 10px; border-radius: 9px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .period { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .period button { flex: none; width: 48px; height: 48px; border-radius: 12px; border: 0; background: #fff; font-size: 22px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .period div { flex: 1; text-align: center; font-weight: 700; }

  .toast {
    position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px;
    font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header class="top">
  <h1>☕ Propinas del café</h1>
  <nav class="tabs" id="tabs">
    <button data-tab="dia">Día</button>
    <button data-tab="historial">Historial</button>
    <button data-tab="resumen">Resumen</button>
    <button data-tab="equipo">Equipo</button>
  </nav>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ---------- Utilidades ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function clp(n) {
  const sign = n < 0 ? '-' : '';
  return sign + '$' + String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
const fmtH = h => String(Math.round(h * 100) / 100).replace('.', ',');
const pad = n => String(n).padStart(2, '0');
const toISO = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => toISO(new Date());
function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function fmtDateLong(iso) {
  const d = parseISO(iso);
  return cap(DIAS[d.getDay()]) + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear();
}
function fmtDateShort(iso) {
  const d = parseISO(iso);
  return cap(DIAS[d.getDay()]) + ' ' + d.getDate() + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
}
const sum = a => a.reduce((x, y) => x + y, 0);

/* ---------- Cálculo (funciones puras) ----------
   Cada pozo se reparte proporcional a las horas del turno.
   Cada monto se redondea al peso: ,5 o más sube; menos de ,5 baja.
   Se trabaja en cuartos de hora enteros para que el redondeo sea exacto. */
function splitPool(tip, quarters) {
  const total = sum(quarters);
  if (!total || !tip) return quarters.map(() => 0);
  return quarters.map(q => Math.floor((2 * tip * q + total) / (2 * total)));
}
function compute(day) {
  const names = Object.keys(day.hours).filter(n => (day.hours[n].am || 0) > 0 || (day.hours[n].pm || 0) > 0);
  const qAM = names.map(n => Math.round((day.hours[n].am || 0) * 4));
  const qPM = names.map(n => Math.round((day.hours[n].pm || 0) * 4));
  const pAM = splitPool(day.tipAM || 0, qAM);
  const pPM = splitPool(day.tipPM || 0, qPM);
  const rows = names.map((n, i) => ({
    name: n, hAM: qAM[i] / 4, hPM: qPM[i] / 4, pAM: pAM[i], pPM: pPM[i], total: pAM[i] + pPM[i]
  }));
  return {
    rows,
    hAM: sum(qAM) / 4, hPM: sum(qPM) / 4,
    paidAM: sum(pAM), paidPM: sum(pPM), total: sum(pAM) + sum(pPM)
  };
}

/* ---------- Estado ---------- */
let team = LS.get('prop_people', []);
let history = LS.get('prop_history', {});
const newDay = (date = todayISO()) => ({ date, tipAM: 0, tipPM: 0, hours: {}, orig: null });
const S = { tab: 'dia', step: 1, day: newDay(), detail: null, sum: { mode: 'semana', anchor: todayISO() } };

(function loadDraft() {
  const d = LS.get('prop_draft', null);
  if (!d || !d.day) return;
  // Si el día del borrador ya se terminó y era otro día, partir uno nuevo.
  if (d.step === 4 && d.day.date !== todayISO()) return;
  S.step = d.step; S.day = d.day;
})();
const saveDraft = () => LS.set('prop_draft', { step: S.step, day: S.day });
const saveTeam = () => LS.set('prop_people', team);
const saveHistory = () => LS.set('prop_history', history);

function dayNames() {
  const extra = Object.keys(S.day.hours).filter(n => !team.includes(n));
  return team.concat(extra);
}
function getH(name, t) { return (S.day.hours[name] && S.day.hours[name][t]) || 0; }
function setH(name, t, v) {
  if (!S.day.hours[name]) S.day.hours[name] = { am: 0, pm: 0 };
  S.day.hours[name][t] = v;
}
function cleanDay(day) {
  const hours = {};
  for (const n of Object.keys(day.hours)) {
    const h = day.hours[n];
    if ((h.am || 0) > 0 || (h.pm || 0) > 0) hours[n] = { am: h.am || 0, pm: h.pm || 0 };
  }
  return { date: day.date, tipAM: day.tipAM || 0, tipPM: day.tipPM || 0, hours };
}

/* ---------- Mensajes ---------- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Texto copiado'); return; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
  ta.select(); try { document.execCommand('copy'); toast('Texto copiado'); } catch (e) {} ta.remove();
}
async function shareText(text) {
  if (navigator.share) {
    try { await navigator.share({ text }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

/* ---------- Consolidado ---------- */
function sheetHTML(day) {
  const c = compute(day);
  const rate = (tip, h) => h ? clp(tip / h) + '/h' : 'sin horas';
  const cell = (p, h, cls) => h
    ? `<td class="${cls}">${clp(p)}<small>${fmtH(h)} h</small></td>`
    : `<td class="zero">—</td>`;
  const rows = c.rows.map(r => `<tr>
      <td class="name">${esc(r.name)}</td>
      ${cell(r.pAM, r.hAM, 'c-am')}${cell(r.pPM, r.hPM, 'c-pm')}
      <td class="tot">${clp(r.total)}</td></tr>`).join('');
  const notes = [];
  if (c.paidAM !== (day.tipAM || 0) && c.hAM) notes.push(`AM: por redondeo se reparten ${clp(c.paidAM)} (diferencia de ${clp(c.paidAM - day.tipAM)}).`);
  if (c.paidPM !== (day.tipPM || 0) && c.hPM) notes.push(`PM: por redondeo se reparten ${clp(c.paidPM)} (diferencia de ${clp(c.paidPM - day.tipPM)}).`);
  return `<div class="sheet">
    <div class="sheet-title">Reparto de propinas</div>
    <div class="sheet-date">${fmtDateLong(day.date)}</div>
    <div class="pools">
      <div class="pool am"><span>PROPINA AM</span><b>${clp(day.tipAM || 0)}</b><small>${fmtH(c.hAM)} h · ${rate(day.tipAM || 0, c.hAM)}</small></div>
      <div class="pool pm"><span>PROPINA PM</span><b>${clp(day.tipPM || 0)}</b><small>${fmtH(c.hPM)} h · ${rate(day.tipPM || 0, c.hPM)}</small></div>
    </div>
    ${c.rows.length ? `<table class="t">
      <thead><tr><th>Nombre</th><th>AM</th><th>PM</th><th>Total</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>Total</td><td class="c-am">${clp(c.paidAM)}</td><td class="c-pm">${clp(c.paidPM)}</td><td>${clp(c.total)}</td></tr></tfoot>
    </table>` : `<div class="empty">Nadie tiene horas este día.</div>`}
    <div class="grand"><span>Total a depositar</span><b>${clp(c.total)}</b></div>
    ${notes.length ? `<div class="round-note">${notes.join('<br>')}</div>` : ''}
  </div>`;
}
function dayText(day) {
  const c = compute(day);
  const lines = [
    `*Propinas ${fmtDateShort(day.date)}*`,
    `Propina AM: ${clp(day.tipAM || 0)} (${fmtH(c.hAM)} h)`,
    `Propina PM: ${clp(day.tipPM || 0)} (${fmtH(c.hPM)} h)`,
    ''
  ];
  for (const r of c.rows) {
    const parts = [];
    if (r.hAM) parts.push(`AM ${fmtH(r.hAM)} h ${clp(r.pAM)}`);
    if (r.hPM) parts.push(`PM ${fmtH(r.hPM)} h ${clp(r.pPM)}`);
    lines.push(`• ${r.name}: *${clp(r.total)}* (${parts.join(' · ')})`);
  }
  lines.push('', `*Total: ${clp(c.total)}*`);
  return lines.join('\n');
}

/* ---------- Pestaña Día (pasos) ---------- */
const stepsHTML = n => `<div class="steplabel">Paso ${n} de 4</div><div class="steps">${[1, 2, 3, 4].map(i => `<span class="${i <= n ? 'on' : ''}"></span>`).join('')}</div>`;
const bar = inner => `<div class="bar"><div class="bar-inner">${inner}</div></div>`;

function renderDia() {
  const d = S.day;
  if (S.step === 1) {
    const exists = history[d.date] && d.orig !== d.date;
    return stepsHTML(1) + `
      <h2>¿Qué día vas a calcular?</h2>
      <p class="hint">Parte con el día de hoy. Cámbialo si es otro día.</p>
      <div class="card">
        <input type="date" class="big-input" id="fDate" value="${d.date}" max="${todayISO()}">
        <p class="hint" style="margin:8px 0 0">${fmtDateLong(d.date)}</p>
      </div>
      ${exists ? `<div class="warn">Este día ya está guardado. Si sigues, se cargan sus datos para corregirlos.</div>` : ''}
      ${d.orig ? `<div class="note">Estás corrigiendo el ${fmtDateShort(d.orig)}.</div>` : ''}
    ` + bar(`<button class="btn" data-act="next">Siguiente →</button>`);
  }
  if (S.step === 2) {
    const v = n => n ? String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
    const ok = (d.tipAM || 0) > 0 || (d.tipPM || 0) > 0;
    return stepsHTML(2) + `
      <h2>¿Cuánto fue la propina?</h2>
      <p class="hint">${fmtDateLong(d.date)}</p>
      <div class="card">
        <label class="field"><span class="lbl">Propina turno AM <span class="sub">hasta las 15:30</span></span>
          <div class="money"><input class="big-input" id="tipAM" inputmode="numeric" autocomplete="off" placeholder="0" value="${v(d.tipAM)}"></div></label>
        <label class="field" style="margin-bottom:0"><span class="lbl">Propina turno PM <span class="sub">hasta las 22:00</span></span>
          <div class="money"><input class="big-input" id="tipPM" inputmode="numeric" autocomplete="off" placeholder="0" value="${v(d.tipPM)}"></div></label>
      </div>
    ` + bar(`<div class="row"><button class="btn sec" data-act="back">← Atrás</button><button class="btn" data-act="next" id="next2" ${ok ? '' : 'disabled'}>Siguiente →</button></div>`);
  }
  if (S.step === 3) {
    const names = dayNames();
    const turn = (i, n, t) => `<div class="turn ${t}">
        <span class="tlabel">${t.toUpperCase()}</span>
        <button data-act="dec" data-i="${i}" data-t="${t}" aria-label="Restar media hora">−</button>
        <input data-i="${i}" data-t="${t}" class="hrs" inputmode="decimal" value="${fmtH(getH(n, t))}" aria-label="Horas ${t.toUpperCase()} de ${esc(n)}">
        <button data-act="inc" data-i="${i}" data-t="${t}" aria-label="Sumar media hora">+</button>
      </div>`;
    const cards = names.map((n, i) => `<div class="card person ${getH(n, 'am') || getH(n, 'pm') ? 'active' : ''}" id="p${i}">
        <div class="pname">${esc(n)}</div>
        <div class="turns">${turn(i, n, 'am')}${turn(i, n, 'pm')}</div>
      </div>`).join('');
    return stepsHTML(3) + `
      <h2>¿Cuántas horas trabajó cada uno?</h2>
      <p class="hint">Usa − y + (de media hora) o escribe el número. Deja en 0 a quien no trabajó.</p>
      ${names.length ? cards : `<div class="card empty">Todavía no hay personas. Agrega a tu equipo aquí abajo.</div>`}
      <div class="card">
        <div class="lbl" style="font-weight:600;margin-bottom:8px">Agregar persona</div>
        <div class="add-row"><input id="newName" placeholder="Nombre" autocomplete="off"><button class="btn" data-act="add3">Agregar</button></div>
      </div>
      <div id="warn3"></div>
    ` + bar(`<div class="totals" id="totals3"></div><div class="row"><button class="btn sec" data-act="back">← Atrás</button><button class="btn" data-act="next" id="next3">Ver resultado →</button></div>`);
  }
  // Paso 4
  return stepsHTML(4) + `
    <div class="note">✓ Día guardado. Puedes sacarle una captura de pantalla o enviarlo por WhatsApp.</div>
    ${sheetHTML(d)}
    <div class="stack">
      <button class="btn" data-act="share">Enviar por WhatsApp</button>
      <div class="row"><button class="btn sec" data-act="copy">Copiar texto</button><button class="btn sec" data-act="edit">Corregir</button></div>
      <button class="btn ghost" data-act="newday">Empezar un día nuevo</button>
    </div>`;
}

function updateStep3() {
  const names = dayNames();
  const hAM = sum(names.map(n => getH(n, 'am')));
  const hPM = sum(names.map(n => getH(n, 'pm')));
  const t = document.getElementById('totals3');
  if (t) t.innerHTML = `Horas AM: <b>${fmtH(hAM)}</b> · Horas PM: <b>${fmtH(hPM)}</b>`;
  const w = [];
  if ((S.day.tipAM || 0) > 0 && !hAM) w.push('Hay propina AM pero nadie tiene horas AM.');
  if ((S.day.tipPM || 0) > 0 && !hPM) w.push('Hay propina PM pero nadie tiene horas PM.');
  const wEl = document.getElementById('warn3');
  if (wEl) wEl.innerHTML = w.map(x => `<div class="warn">${x}</div>`).join('');
  const nx = document.getElementById('next3');
  if (nx) nx.disabled = w.length > 0 || (!hAM && !hPM);
  names.forEach((n, i) => {
    const card = document.getElementById('p' + i);
    if (card) card.classList.toggle('active', getH(n, 'am') > 0 || getH(n, 'pm') > 0);
  });
}

function finishDay() {
  const day = cleanDay(S.day);
  if (S.day.orig && S.day.orig !== day.date) delete history[S.day.orig];
  history[day.date] = day;
  saveHistory();
  S.day.orig = day.date;
}

function startDay(date) {
  S.day = newDay(date); S.step = 1; saveDraft();
}
function loadForEdit(date) {
  const h = history[date];
  S.day = { date, tipAM: h.tipAM, tipPM: h.tipPM, hours: JSON.parse(JSON.stringify(h.hours)), orig: date };
  S.step = 2; saveDraft();
}

/* ---------- Pestaña Historial ---------- */
function renderHistorial() {
  if (S.detail && history[S.detail]) {
    const day = history[S.detail];
    return `<button class="btn ghost" data-act="hback" style="text-align:left;padding-left:0">← Volver al historial</button>
      ${sheetHTML(day)}
      <div class="stack">
        <button class="btn" data-act="hshare">Enviar por WhatsApp</button>
        <div class="row"><button class="btn sec" data-act="hcopy">Copiar texto</button><button class="btn sec" data-act="hedit">Corregir</button></div>
        <button class="btn danger" data-act="hdel">Borrar este día</button>
      </div>`;
  }
  const dates = Object.keys(history).sort().reverse();
  if (!dates.length) return `<h2>Historial</h2><div class="empty">Aún no hay días guardados.</div>`;
  return `<h2>Historial</h2><p class="hint">Toca un día para verlo, corregirlo o borrarlo.</p>` +
    dates.map(dt => {
      const c = compute(history[dt]);
      return `<button class="list-item" data-act="hopen" data-date="${dt}">
        <div><div class="l1">${fmtDateShort(dt)}</div><div class="l2">${c.rows.length} personas</div></div>
        <div class="amt">${clp(c.total)}</div></button>`;
    }).join('');
}

/* ---------- Pestaña Resumen ---------- */
function periodRange() {
  const a = parseISO(S.sum.anchor);
  if (S.sum.mode === 'semana') {
    const start = new Date(a); start.setDate(a.getDate() - ((a.getDay() + 6) % 7)); // lunes
    const end = new Date(start); end.setDate(start.getDate() + 6);
    return { start: toISO(start), end: toISO(end),
      label: `${start.getDate()} ${MESES[start.getMonth()].slice(0, 3)} – ${end.getDate()} ${MESES[end.getMonth()].slice(0, 3)} ${end.getFullYear()}` };
  }
  const start = new Date(a.getFullYear(), a.getMonth(), 1);
  const end = new Date(a.getFullYear(), a.getMonth() + 1, 0);
  return { start: toISO(start), end: toISO(end), label: cap(MESES[a.getMonth()]) + ' ' + a.getFullYear() };
}
function aggregate() {
  const r = periodRange();
  const dates = Object.keys(history).filter(d => d >= r.start && d <= r.end).sort();
  const people = {};
  let tips = 0, paid = 0;
  for (const d of dates) {
    const day = history[d], c = compute(day);
    tips += (day.tipAM || 0) + (day.tipPM || 0); paid += c.total;
    for (const row of c.rows) {
      const p = people[row.name] || (people[row.name] = { days: 0, h: 0, total: 0 });
      p.days++; p.h += row.hAM + row.hPM; p.total += row.total;
    }
  }
  const list = Object.entries(people).sort((x, y) => y[1].total - x[1].total);
  return { r, dates, list, tips, paid };
}
function renderResumen() {
  const g = aggregate();
  const body = g.dates.length ? `<div class="sheet">
      <div class="sheet-title">Resumen ${S.sum.mode === 'semana' ? 'semanal' : 'mensual'}</div>
      <div class="sheet-date">${g.r.label}</div>
      <p class="hint" style="margin-top:-6px">${g.dates.length} ${g.dates.length === 1 ? 'día registrado' : 'días registrados'}</p>
      <table class="t">
        <thead><tr><th>Nombre</th><th>Días</th><th>Horas</th><th>Total</th></tr></thead>
        <tbody>${g.list.map(([n, p]) => `<tr><td class="name">${esc(n)}</td><td>${p.days}</td><td>${fmtH(p.h)}</td><td class="tot">${clp(p.total)}</td></tr>`).join('')}</tbody>
      </table>
      <div class="grand"><span>Total repartido</span><b>${clp(g.paid)}</b></div>
    </div>
    <div class="row"><button class="btn" data-act="sshare">WhatsApp</button><button class="btn sec" data-act="scopy">Copiar texto</button></div>`
    : `<div class="empty">No hay días guardados en este período.</div>`;
  return `<h2>Resumen</h2>
    <div class="seg"><button data-act="smode" data-mode="semana" class="${S.sum.mode === 'semana' ? 'on' : ''}">Semana</button><button data-act="smode" data-mode="mes" class="${S.sum.mode === 'mes' ? 'on' : ''}">Mes</button></div>
    <div class="period"><button data-act="sprev" aria-label="Anterior">‹</button><div>${g.r.label}</div><button data-act="snext" aria-label="Siguiente">›</button></div>
    ${body}`;
}
function summaryText() {
  const g = aggregate();
  const dias = k => k + (k === 1 ? ' día' : ' días');
  const lines = [`*Resumen propinas ${g.r.label}*`, g.dates.length === 1 ? '1 día registrado' : g.dates.length + ' días registrados', ''];
  for (const [n, p] of g.list) lines.push(`• ${n}: *${clp(p.total)}* (${dias(p.days)}, ${fmtH(p.h)} h)`);
  lines.push('', `*Total: ${clp(g.paid)}*`);
  return lines.join('\n');
}

/* ---------- Pestaña Equipo ---------- */
function renderEquipo() {
  return `<h2>Equipo</h2>
    <p class="hint">Las personas que aparecen al anotar las horas. Quitar a alguien no cambia los días ya guardados.</p>
    <div class="card"><div class="add-row"><input id="teamName" placeholder="Nombre" autocomplete="off"><button class="btn" data-act="tadd">Agregar</button></div></div>
    ${team.length ? team.map((n, i) => `<div class="list-item"><div class="l1">${esc(n)}</div><button class="x" data-act="tdel" data-i="${i}">Quitar</button></div>`).join('')
      : `<div class="empty">Todavía no hay personas.</div>`}`;
}

function addPerson(raw) {
  const name = raw.trim().replace(/\s+/g, ' ');
  if (!name) return false;
  if (team.some(n => n.toLowerCase() === name.toLowerCase())) { toast('Esa persona ya está'); return false; }
  team.push(name); saveTeam(); return true;
}

/* ---------- Render y eventos ---------- */
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const app = document.getElementById('app');
  app.innerHTML = S.tab === 'dia' ? renderDia() : S.tab === 'historial' ? renderHistorial() : S.tab === 'resumen' ? renderResumen() : renderEquipo();
  if (S.tab === 'dia' && S.step === 3) updateStep3();
}

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  S.tab = b.dataset.tab; S.detail = null; render(); window.scrollTo(0, 0);
});

document.getElementById('app').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  const names = dayNames();
  switch (act) {
    case 'next':
      if (S.step === 1 && history[S.day.date] && S.day.orig !== S.day.date) { loadForEdit(S.day.date); render(); window.scrollTo(0, 0); return; }
      if (S.step === 3) finishDay();
      S.step++; saveDraft(); render(); window.scrollTo(0, 0); break;
    case 'back': S.step--; saveDraft(); render(); window.scrollTo(0, 0); break;
    case 'inc': case 'dec': {
      const n = names[+b.dataset.i], t = b.dataset.t;
      const v = Math.min(24, Math.max(0, getH(n, t) + (act === 'inc' ? 0.5 : -0.5)));
      setH(n, t, v); saveDraft();
      const inp = document.querySelector(`input.hrs[data-i="${b.dataset.i}"][data-t="${t}"]`);
      if (inp) inp.value = fmtH(v);
      updateStep3(); break;
    }
    case 'add3': {
      const inp = document.getElementById('newName');
      if (addPerson(inp.value)) { render(); const last = document.getElementById('p' + (dayNames().indexOf(team[team.length - 1]))); if (last) last.scrollIntoView({ block: 'center' }); }
      break;
    }
    case 'share': shareText(dayText(cleanDay(S.day))); break;
    case 'copy': copyText(dayText(cleanDay(S.day))); break;
    case 'edit': S.step = 2; saveDraft(); render(); window.scrollTo(0, 0); break;
    case 'newday': startDay(todayISO()); render(); window.scrollTo(0, 0); break;
    case 'hopen': S.detail = b.dataset.date; render(); window.scrollTo(0, 0); break;
    case 'hback': S.detail = null; render(); break;
    case 'hshare': shareText(dayText(history[S.detail])); break;
    case 'hcopy': copyText(dayText(history[S.detail])); break;
    case 'hedit': loadForEdit(S.detail); S.detail = null; S.tab = 'dia'; render(); window.scrollTo(0, 0); break;
    case 'hdel':
      if (confirm('¿Borrar el ' + fmtDateShort(S.detail) + '? No se puede deshacer.')) {
        delete history[S.detail]; saveHistory();
        if (S.day.orig === S.detail) startDay(todayISO());
        S.detail = null; render(); toast('Día borrado');
      }
      break;
    case 'smode': S.sum.mode = b.dataset.mode; render(); break;
    case 'sprev': case 'snext': {
      const a = parseISO(S.sum.anchor), dir = act === 'snext' ? 1 : -1;
      if (S.sum.mode === 'semana') a.setDate(a.getDate() + 7 * dir); else a.setMonth(a.getMonth() + dir, 1);
      S.sum.anchor = toISO(a); render(); break;
    }
    case 'sshare': shareText(summaryText()); break;
    case 'scopy': copyText(summaryText()); break;
    case 'tadd': {
      const inp = document.getElementById('teamName');
      if (addPerson(inp.value)) { render(); document.getElementById('teamName').focus(); }
      break;
    }
    case 'tdel': {
      const n = team[+b.dataset.i];
      if (confirm('¿Quitar a ' + n + ' del equipo?')) {
        team.splice(+b.dataset.i, 1); saveTeam();
        if (S.day.hours[n] && !getH(n, 'am') && !getH(n, 'pm')) { delete S.day.hours[n]; saveDraft(); }
        render();
      }
      break;
    }
  }
});

document.getElementById('app').addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'tipAM' || el.id === 'tipPM') {
    const digits = el.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 9);
    el.value = digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    S.day[el.id] = digits ? Number(digits) : 0; saveDraft();
    const nx = document.getElementById('next2');
    if (nx) nx.disabled = !(S.day.tipAM > 0 || S.day.tipPM > 0);
  }
});

document.getElementById('app').addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'fDate' && el.value) {
    S.day.date = el.value; saveDraft(); render();
  }
  if (el.classList.contains('hrs')) {
    const n = dayNames()[+el.dataset.i];
    let v = parseFloat(el.value.replace(',', '.'));
    if (!isFinite(v) || v < 0) v = 0;
    v = Math.min(24, Math.round(v * 4) / 4);
    setH(n, el.dataset.t, v); saveDraft();
    el.value = fmtH(v); updateStep3();
  }
});

document.getElementById('app').addEventListener('focusin', e => {
  if (e.target.classList.contains('hrs')) e.target.select();
});

document.getElementById('app').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'newName') document.querySelector('[data-act="add3"]').click();
  if (e.target.id === 'teamName') document.querySelector('[data-act="tadd"]').click();
  if (e.target.classList.contains('hrs') || e.target.id === 'tipAM' || e.target.id === 'tipPM') e.target.blur();
});

render();
</script>
</body>
</html>
